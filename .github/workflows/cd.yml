name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          push: true
          tags: ghcr.io/berzantas/vex-agentscan-server:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ghcr.io/berzantas/vex-agentscan-web:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          push: true
          tags: ghcr.io/berzantas/vex-agentscan-migrate:${{ github.sha }}
